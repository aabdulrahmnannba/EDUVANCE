<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="assets/css/style.css">

<style>

}

.thankyou-card{
    max-width:700px;
    width:100%;
    text-align:center;
    background:#fff;
    padding:50px 30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.thankyou-icon{
    font-size:80px;
    margin-bottom:20px;
}

.thankyou-card h1{
    margin-bottom:15px;
}

.thankyou-card p{
    margin-bottom:30px;
    line-height:1.8;
}

.btn-group{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:12px 25px;
    border-radius:10px;
    font-weight:600;
